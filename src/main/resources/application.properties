spring.application.name=wordbook-backend

# ===== 数据库：MySQL 8.x =====
# ⚠️ 密码不能写死：仓库是公开的，写死的密码等于挂到网上。
# ${DB_PASSWORD:root123456} 的写法是「先读环境变量 DB_PASSWORD，读不到才用冒号后面那个默认值」。
# 好处是本地开发不用配任何东西照样能跑，部署到服务器时设一下环境变量就覆盖掉了。
#
# createDatabaseIfNotExist=true：第一次连时自动把 wordbook 库建出来，省一条 SQL
# characterEncoding=utf8 + useUnicode：中文不乱码
# serverTimezone=Asia/Shanghai：MySQL 8 必须显式给时区，否则时间差 8 小时
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:wordbook}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis 不帮你建表（JPA 那条 ddl-auto=update 已经删了），表得自己写 SQL
# 这个开关让 Spring 每次启动时去执行 resources/schema.sql
spring.sql.init.mode=always

# ⚠️ 这行不能省：Spring 读 schema.sql / data.sql 时按这个编码解码。
# 不写就用操作系统的默认编码（Windows 是 GBK），而我们的文件是 UTF-8 存的，
# 结果中文会变成「v. 鏀惧純」这种乱码 —— 而且不报错，只有数据脏了。
spring.sql.init.encoding=UTF-8

# 把 MyBatis 真正执行的 SQL 打到控制台 —— 等价于原来 JPA 的 show-sql，学习阶段很有用
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# 数据库列名 word_count 自动对应 Java 属性 wordCount。
# 我们现在字段都同名，用不上，但先开着：以后加多词字段就不用踩这个坑
mybatis.configuration.map-underscore-to-camel-case=true
